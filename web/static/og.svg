<?xml version="1.0" encoding="UTF-8"?>
<!--
  pixelgo OpenGraph image — 1200x630.
  Hand-edited source of truth. The matching og.png is generated by
  cmd/genogimage (see `make og-image`). Update both when changing the design.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="pixelgo — high-throughput tracking pixel">
  <defs>
    <radialGradient id="auroraRed" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraIndigo" cx="85%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.65"/>
      <stop offset="100%" stop-color="#4338ca" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraRose" cx="50%" cy="50%" r="35%">
      <stop offset="0%" stop-color="#e11d48" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#e11d48" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brandStripe" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="33%" stop-color="#dc2626"/>
      <stop offset="33%" stop-color="#f8fafc"/>
      <stop offset="66%" stop-color="#f8fafc"/>
      <stop offset="66%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="headlineFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>

  <!-- Base canvas — matches bg-slate-950. -->
  <rect width="1200" height="630" fill="#020617"/>
  <rect width="1200" height="630" fill="url(#auroraRed)"/>
  <rect width="1200" height="630" fill="url(#auroraIndigo)"/>
  <rect width="1200" height="630" fill="url(#auroraRose)"/>

  <!-- Brand mark + wordmark, top-left. -->
  <g transform="translate(72,72)">
    <rect x="0" y="0" width="22" height="22" rx="3" fill="url(#brandStripe)"/>
    <text x="36" y="18" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="20" font-weight="700" letter-spacing="6" fill="#e2e8f0">PIXELGO</text>
  </g>

  <!-- Headline. SVG <text> renders crisply on every consumer that supports SVG. -->
  <g transform="translate(72,260)">
    <text x="0" y="0" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="84" font-weight="900" fill="url(#headlineFill)" letter-spacing="-2">One pixel.</text>
    <text x="0" y="100" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
          font-size="84" font-weight="900" fill="#ffffff" letter-spacing="-2">Built for the hot path.</text>
  </g>

  <!-- Subhead. -->
  <text x="72" y="450" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
        font-size="26" font-weight="500" fill="#cbd5e1" letter-spacing="-0.2">
    Go 1.25 · Pipelined Redis INCR · Versioned JSON API
  </text>

  <!-- Decorative pixel cluster, bottom-right — alludes to the 1x1 tracking pixel. -->
  <g transform="translate(820,420)" opacity="0.95">
    <g>
      <rect x="0"   y="0"   width="22" height="22" fill="#1e293b"/>
      <rect x="28"  y="0"   width="22" height="22" fill="#dc2626"/>
      <rect x="56"  y="0"   width="22" height="22" fill="#1e293b"/>
      <rect x="84"  y="0"   width="22" height="22" fill="#f8fafc"/>
      <rect x="112" y="0"   width="22" height="22" fill="#1e293b"/>
      <rect x="140" y="0"   width="22" height="22" fill="#4338ca"/>
      <rect x="168" y="0"   width="22" height="22" fill="#1e293b"/>

      <rect x="0"   y="28"  width="22" height="22" fill="#4338ca"/>
      <rect x="28"  y="28"  width="22" height="22" fill="#1e293b"/>
      <rect x="56"  y="28"  width="22" height="22" fill="#f8fafc"/>
      <rect x="84"  y="28"  width="22" height="22" fill="#1e293b"/>
      <rect x="112" y="28"  width="22" height="22" fill="#dc2626"/>
      <rect x="140" y="28"  width="22" height="22" fill="#1e293b"/>
      <rect x="168" y="28"  width="22" height="22" fill="#1e293b"/>

      <rect x="0"   y="56"  width="22" height="22" fill="#1e293b"/>
      <rect x="28"  y="56"  width="22" height="22" fill="#f8fafc"/>
      <rect x="56"  y="56"  width="22" height="22" fill="#1e293b"/>
      <rect x="84"  y="56"  width="22" height="22" fill="#4338ca"/>
      <rect x="112" y="56"  width="22" height="22" fill="#1e293b"/>
      <rect x="140" y="56"  width="22" height="22" fill="#dc2626"/>
      <rect x="168" y="56"  width="22" height="22" fill="#1e293b"/>

      <rect x="0"   y="84"  width="22" height="22" fill="#dc2626"/>
      <rect x="28"  y="84"  width="22" height="22" fill="#1e293b"/>
      <rect x="56"  y="84"  width="22" height="22" fill="#4338ca"/>
      <rect x="84"  y="84"  width="22" height="22" fill="#1e293b"/>
      <rect x="112" y="84"  width="22" height="22" fill="#f8fafc"/>
      <rect x="140" y="84"  width="22" height="22" fill="#1e293b"/>
      <rect x="168" y="84"  width="22" height="22" fill="#dc2626"/>
    </g>
  </g>

  <!-- Bottom stripe — patriotic accent. -->
  <rect x="0" y="618" width="1200" height="12" fill="url(#brandStripe)"/>
</svg>
