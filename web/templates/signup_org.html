<!doctype html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pixelgo — name your org</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center text-slate-100">
  <main class="w-full max-w-sm p-8 bg-slate-900 rounded-2xl shadow-xl border border-slate-800">
    <h1 class="text-2xl font-semibold mb-1">Name your organization</h1>
    <p class="text-sm text-slate-400 mb-6">Step 2 of 2. You'll be the owner.</p>

    <p class="text-xs text-slate-500 mb-4">Signed in as <span class="font-mono">{{ .Email }}</span></p>

    {{ if .Error }}
    <div class="mb-4 rounded-md bg-red-950 border border-red-800 px-3 py-2 text-sm text-red-200">
      {{ if eq .Error "name" }}Please enter an organization name.{{ end }}
    </div>
    {{ end }}

    <form method="post" action="/signup/org" class="space-y-4">
      <label class="block">
        <span class="text-sm text-slate-300">Organization name</span>
        <input type="text" name="name" required autofocus maxlength="80"
          placeholder="Acme, Inc."
          class="mt-1 w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </label>
      <button type="submit"
        class="w-full rounded-md bg-indigo-600 hover:bg-indigo-500 px-3 py-2 text-sm font-medium">
        Finish
      </button>
    </form>

    <form method="post" action="/logout" class="mt-4 text-center">
      <button class="text-xs text-slate-500 hover:text-slate-300">Sign out</button>
    </form>
  </main>
</body>
</html>
