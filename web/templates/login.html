<!doctype html>
<html lang="en" class="h-full bg-slate-950">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>pixelgo — sign in</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center text-slate-100">
  <main class="w-full max-w-sm p-8 bg-slate-900 rounded-2xl shadow-xl border border-slate-800">
    <h1 class="text-2xl font-semibold mb-1">pixelgo</h1>
    <p class="text-sm text-slate-400 mb-6">Admin sign in</p>

    {{ if .Error }}
    <div class="mb-4 rounded-md bg-red-950 border border-red-800 px-3 py-2 text-sm text-red-200">
      Invalid email or password.
    </div>
    {{ end }}

    <form method="post" action="/login" class="space-y-4">
      <label class="block">
        <span class="text-sm text-slate-300">Email</span>
        <input type="email" name="email" required autofocus
          class="mt-1 w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </label>
      <label class="block">
        <span class="text-sm text-slate-300">Password</span>
        <input type="password" name="password" required
          class="mt-1 w-full rounded-md bg-slate-800 border border-slate-700 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" />
      </label>
      <button type="submit"
        class="w-full rounded-md bg-indigo-600 hover:bg-indigo-500 px-3 py-2 text-sm font-medium">
        Sign in
      </button>
    </form>

    <p class="mt-4 text-xs text-slate-500">
      Need an account?
      <a href="/signup" class="text-indigo-400 hover:text-indigo-300">Create one</a>.
    </p>
  </main>
</body>
</html>
